<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOREZ - Download Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-gradient-mesh {
            background: linear-gradient(135deg, #090d16, #120f24, #1a0b2e);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            will-change: background-position;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-gradient-mesh min-h-screen text-white pb-12">

    <!-- HEADER -->
    <div class="max-w-md mx-auto px-4 pt-8 pb-4 text-center">
        <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-white via-indigo-200 to-indigo-400 bg-clip-text text-transparent">MOREZ</h1>
        <p class="text-gray-400 text-sm mt-1">Digital Products & Applications Catalog</p>
    </div>

    <!-- SEARCH & FILTER -->
    <div class="max-w-md mx-auto px-4 mb-6">
        <input type="text" id="searchInput" oninput="filterApps()" placeholder="Cari aplikasi..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 mb-3">
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="setCategory('Semua')" id="cat-Semua" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shrink-0">Semua</button>
            <button onclick="setCategory('Game')" id="cat-Game" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/5 text-gray-400 border border-white/10 shrink-0">Game</button>
            <button onclick="setCategory('Aplikasi Pro')" id="cat-Aplikasi Pro" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/5 text-gray-400 border border-white/10 shrink-0">Aplikasi Pro</button>
            <button onclick="setCategory('Utility')" id="cat-Utility" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/5 text-gray-400 border border-white/10 shrink-0">Utility</button>
        </div>
    </div>

    <!-- CONTAINER DAFTAR APLIKASI -->
    <div id="publicAppList" class="max-w-md mx-auto px-4 space-y-3">
        <!-- Data dimuat secara otomatis dari Firebase -->
        <p class="text-center text-gray-500 py-8">Memuat aplikasi...</p>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
    apiKey: "AIzaSyBYo_GAMxZKC069mDGQM2DCU9Cd2W9nzgI",
    authDomain: "morez-d529e.firebaseapp.com",
    projectId: "morez-d529e",
    storageBucket: "morez-d529e.firebasestorage.app",
    messagingSenderId: "349096012891",
    appId: "1:349096012891:web:4987f9cb7cf5083c9c237e",
    measurementId: "G-L4ELDRJSZG"
  };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allApps = [];
        let currentCategory = 'Semua';

        async function fetchPublicApps() {
            try {
                const querySnapshot = await getDocs(collection(db, "apps"));
                allApps = [];
                querySnapshot.forEach((doc) => {
                    allApps.push(doc.data());
                });
                renderApps(allApps);
            } catch (e) {
                console.error(e);
                document.getElementById('publicAppList').innerHTML = '<p class="text-center text-red-400 py-4">Gagal memuat data aplikasi.</p>';
            }
        }

        window.renderApps = function(dataArray) {
            const container = document.getElementById('publicAppList');
            container.innerHTML = '';

            if(dataArray.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">Tidak ada aplikasi ditemukan.</p>';
                return;
            }

            dataArray.forEach(app => {
                container.innerHTML += `
                    <div class="glass p-4 rounded-2xl flex items-center justify-between gap-4 transition hover:bg-white/[0.07]">
                        <div class="flex items-center gap-3.5 min-w-0">
                            <img src="${app.icon || 'https://via.placeholder.com/60'}" class="w-12 h-12 rounded-2xl object-cover bg-white/10 shrink-0" alt="">
                            <div class="min-w-0">
                                <h3 class="font-bold text-sm truncate text-white">${app.name}</h3>
                                <p class="text-xs text-gray-400 mt-0.5">${app.version || 'v1.0'} • ${app.size || '30 MB'}</p>
                            </div>
                        </div>
                        <a href="${app.link}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shrink-0 shadow-lg shadow-indigo-600/30 transition">Download</a>
                    </div>
                `;
            });
        }

        window.setCategory = function(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-white/5', 'text-gray-400');
            });
            document.getElementById('cat-' + cat).classList.remove('bg-white/5', 'text-gray-400');
            document.getElementById('cat-' + cat).classList.add('bg-indigo-600', 'text-white');
            filterApps();
        }

        window.filterApps = function() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app => {
                const matchCategory = (currentCategory === 'Semua' || app.category === currentCategory);
                const matchKeyword = app.name.toLowerCase().includes(keyword);
                return matchCategory && matchKeyword;
            });
            renderApps(filtered);
        }

        fetchPublicApps();
    </script>
</body>
</html>
