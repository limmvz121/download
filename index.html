<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0820">
<title>MOREZ - Katalog Aplikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#6d28d9; --c2:#db2777; --c3:#06b6d4; --c4:#4f46e5;
  --grad:linear-gradient(120deg,#818cf8,#e879f9,#22d3ee,#818cf8);
  --font:'Sora','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);color:#fff;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(135deg,#0b0820,#1a0b3a,#0a1c3f,#2a0a3a);
  background-size:400% 400%;animation:bgmove 14s ease infinite;
}
body.loading{overflow:hidden}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* Blob melayang */
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:340px;height:340px;background:var(--c1);top:-80px;left:-90px;animation:f1 16s ease-in-out infinite}
.b2{width:300px;height:300px;background:var(--c2);top:35%;right:-110px;animation:f2 19s ease-in-out infinite}
.b3{width:380px;height:380px;background:var(--c3);bottom:-140px;left:10%;opacity:.4;animation:f3 22s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,160px) scale(1.25)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-160px,-120px) scale(.85)}}
@keyframes f3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(180px,-140px) scale(1.2)}}

/* Splash / loading */
#splash{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:linear-gradient(135deg,#0b0820,#1d0d44,#0a1c3f);background-size:300% 300%;animation:bgmove 6s ease infinite;
  transition:opacity .7s ease,transform .9s cubic-bezier(.7,0,.2,1),filter .7s;
}
#splash.out{opacity:0;transform:scale(1.15);filter:blur(12px);pointer-events:none}
.orb{position:relative;width:120px;height:120px;display:grid;place-items:center}
.orb::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,#818cf8,#e879f9,#22d3ee,transparent 80%);
  -webkit-mask:radial-gradient(circle,transparent 52px,#000 53px);mask:radial-gradient(circle,transparent 52px,#000 53px);
  animation:spin 1.3s linear infinite;
}
.orb::after{
  content:"";position:absolute;inset:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e879f9,#6d28d9 60%,#1e1b4b);
  box-shadow:0 0 50px rgba(168,85,247,.7);animation:pulse 1.8s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
.splash-logo{display:flex;font-weight:800;font-size:44px;letter-spacing:.08em}
.splash-logo span{
  display:inline-block;opacity:0;transform:translateY(30px) scale(.6);
  background:var(--grad);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:letter .7s cubic-bezier(.2,1.4,.4,1) forwards,shine 3s linear infinite;
}
.splash-logo span:nth-child(1){animation-delay:.1s,0s}
.splash-logo span:nth-child(2){animation-delay:.2s,0s}
.splash-logo span:nth-child(3){animation-delay:.3s,0s}
.splash-logo span:nth-child(4){animation-delay:.4s,0s}
.splash-logo span:nth-child(5){animation-delay:.5s,0s}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-300% 0}}
.bar{width:180px;height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--grad);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
.status{font-size:12px;color:#a5a3c9;letter-spacing:.05em;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}

/* Konten */
.page{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:36px 16px 56px}
header{text-align:center;margin-bottom:22px}
.brand{
  font-size:42px;font-weight:800;letter-spacing:.06em;
  background:var(--grad);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;
}
.tagline{margin-top:6px;font-size:13px;color:#b4b2d6}

#dynamicAlert{display:none;margin-bottom:16px;padding:14px 16px;border-radius:18px;font-size:13px;font-weight:500;line-height:1.6;
  border:1px solid;backdrop-filter:blur(14px);position:relative;overflow:hidden}
#dynamicAlert{white-space:pre-line;overflow-wrap:anywhere}
#alertText a{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px}
#dynamicAlert.show{display:block;animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}
#dynamicAlert::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 4s ease-in-out infinite}
#dynamicAlert.info{background:rgba(99,102,241,.16);border-color:rgba(129,140,248,.45);color:#c7d2fe}
#dynamicAlert.warning{background:rgba(245,158,11,.14);border-color:rgba(251,191,36,.45);color:#fde68a}
#dynamicAlert.success{background:rgba(16,185,129,.14);border-color:rgba(52,211,153,.45);color:#a7f3d0}
#dynamicAlert.danger{background:rgba(244,63,94,.15);border-color:rgba(251,113,133,.45);color:#fecdd3}
@keyframes sweep{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}

.search{display:flex;align-items:center;gap:10px;padding:0 16px;margin-bottom:12px;border-radius:18px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);transition:.25s}
.search:focus-within{border-color:#a78bfa;box-shadow:0 0 0 4px rgba(167,139,250,.2),0 0 30px rgba(167,139,250,.25)}
.search svg{flex:none;color:#a5a3c9}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:14px;padding:14px 0}
.search input::placeholder{color:#7f7da8}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:#b4b2d6;padding:8px 16px;border-radius:99px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:.25s}
.tab:hover{background:rgba(255,255,255,.12);color:#fff}
.tab[aria-selected="true"]{color:#fff;border-color:transparent;background:linear-gradient(120deg,#6366f1,#c026d3,#06b6d4);background-size:200% 100%;
  animation:shine 4s linear infinite;box-shadow:0 6px 22px rgba(168,85,247,.45)}

/* Kartu */
#publicAppList{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:6px}
.card{min-width:0}
.card{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border-radius:22px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);
  opacity:0;animation:rise .7s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i)*70ms);
  transition:transform .3s,background .3s,box-shadow .3s,border-color .3s;
}
.card:hover{transform:translateY(-3px) scale(1.015);background:rgba(255,255,255,.1);border-color:rgba(232,121,249,.5);box-shadow:0 14px 40px rgba(124,58,237,.35)}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.94)}to{opacity:1;transform:none}}
.left{display:flex;align-items:center;gap:13px;min-width:0}
.icon{flex:none;width:54px;height:54px;border-radius:16px;object-fit:cover;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;
  background:linear-gradient(135deg,#6366f1,#d946ef);box-shadow:0 6px 18px rgba(0,0,0,.35);animation:floaty 5s ease-in-out infinite;animation-delay:calc(var(--i)*-.6s)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.info{min-width:0}
.name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:3px;font-size:11.5px;color:#a5a3c9}
.cat{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:600;color:#e9d5ff;padding:2px 9px;border-radius:99px;background:rgba(168,85,247,.22)}
.dl{position:relative;flex:none;overflow:hidden;text-decoration:none;color:#fff;font-weight:700;font-size:12.5px;padding:10px 18px;border-radius:14px;
  background:linear-gradient(120deg,#6366f1,#c026d3,#6366f1);background-size:200% 100%;box-shadow:0 8px 22px rgba(99,102,241,.45);transition:.3s}
.dl::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:glint 3.2s ease-in-out infinite}
@keyframes glint{0%,55%{left:-60%}100%{left:130%}}
.dl:hover{background-position:100% 0;transform:scale(1.06)}
.dl:active{transform:scale(.95)}
.dl:focus-visible,.tab:focus-visible{outline:3px solid #c4b5fd;outline-offset:2px}

.empty{text-align:center;color:#a5a3c9;padding:44px 12px;font-size:13px;animation:pop .5s both}
.empty b{display:block;color:#fff;font-size:15px;margin-bottom:4px}
header,.search,.tabs{animation:pop .7s cubic-bezier(.2,1,.3,1) both}
.search{animation-delay:.1s}.tabs{animation-delay:.2s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card{opacity:1}
}
</style>
</head>
<body class="loading">

<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="splash">
  <div class="orb"></div>
  <div class="splash-logo"><span>M</span><span>O</span><span>R</span><span>E</span><span>Z</span></div>
  <div class="bar"><i></i></div>
  <div class="status" id="status">Memuat katalog...</div>
</div>

<div class="page">
  <header>
    <h1 class="brand">MOREZ</h1>
    <p class="tagline" id="tagline">Digital Products & Applications Catalog</p>
  </header>

  <div id="dynamicAlert" role="status"><span id="alertText"></span></div>

  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="searchInput" placeholder="Cari aplikasi..." autocomplete="off" aria-label="Cari aplikasi">
  </label>
  <div class="tabs" id="tabs" role="tablist"></div>

  <main id="publicAppList" aria-live="polite"></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYo_GAMxZKC069mDGQM2DCU9Cd2W9nzgI",
  authDomain: "morez-d529e.firebaseapp.com",
  projectId: "morez-d529e",
  storageBucket: "morez-d529e.firebasestorage.app",
  messagingSenderId: "349096012891",
  appId: "1:349096012891:web:4987f9cb7cf5083c9c237e",
  measurementId: "G-L4ELDRJSZG"
};
const db = getFirestore(initializeApp(firebaseConfig));

const CATEGORIES = ['Semua','Game','Recorder','Drama','Aplikasi Pro','Utility'];
let allApps = [];
let currentCategory = 'Semua';

const $list = document.getElementById('publicAppList');
const $search = document.getElementById('searchInput');
const $tabs = document.getElementById('tabs');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';

function renderTabs(){
  $tabs.innerHTML = CATEGORIES.map(c =>
    `<button class="tab" role="tab" data-cat="${esc(c)}" aria-selected="${c === currentCategory}">${esc(c)}</button>`).join('');
}

function card(app, i){
  const name = app.name || 'Tanpa nama';
  const letter = esc(name.trim().charAt(0).toUpperCase() || '?');
  const icon = app.icon
    ? `<img class="icon" src="${esc(app.icon)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;icon&quot; style=&quot;--i:${i}&quot;>${letter}</span>'">`
    : `<span class="icon">${letter}</span>`;
  return `
    <div class="card" style="--i:${Math.min(i,12)}">
      <div class="left">
        ${icon}
        <div class="info">
          <div class="name">${esc(name)}</div>
          <div class="meta">${esc([app.version || 'v1.0', app.size].filter(v => v && String(v).trim() !== '-').join(' • '))}</div>
          ${app.category ? `<span class="cat">${esc(app.category)}</span>` : ''}
        </div>
      </div>
      <a class="dl" href="${esc(safeUrl(app.link))}" target="_blank" rel="noopener">Download</a>
    </div>`;
}

window.renderApps = function(list){
  if(!list.length){
    const q = $search.value.trim();
    $list.innerHTML = `<div class="empty"><b>${q ? 'Tidak ada hasil' : 'Belum ada aplikasi'}</b>${
      q ? `Tidak ada aplikasi bernama "${esc(q)}". Coba kata lain atau pilih kategori Semua.` : 'Kategori ini masih kosong. Coba kategori lain.'}</div>`;
    return;
  }
  $list.innerHTML = list.map(card).join('');
};

window.setCategory = function(cat){
  currentCategory = cat;
  $tabs.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.cat === cat));
  window.filterApps();
};

window.filterApps = function(){
  const kw = $search.value.toLowerCase().trim();
  window.renderApps(allApps.filter(a =>
    (currentCategory === 'Semua' || a.category === currentCategory) &&
    String(a.name || '').toLowerCase().includes(kw)));
};

$tabs.addEventListener('click', e => { const b = e.target.closest('.tab'); if(b) window.setCategory(b.dataset.cat); });
$search.addEventListener('input', () => window.filterApps());

function hideSplash(){
  const s = document.getElementById('splash');
  s.classList.add('out');
  document.body.classList.remove('loading');
  setTimeout(() => s.remove(), 1000);
}

async function fetchPublicData(){
  renderTabs();
  const minWait = new Promise(r => setTimeout(r, 2200)); // splash tampil minimal 2,2 detik
  const status = document.getElementById('status');
  try{
    const alertSnap = await getDoc(doc(db, "settings", "alert"));
    if(alertSnap.exists()){
      const a = alertSnap.data();
      if(a.active && a.message){
        document.getElementById('alertText').innerHTML = esc(a.message).replace(
          /\b((?:https?:\/\/)?[a-z0-9-]+(?:\.[a-z]{2,})+(?:\/[^\s,]*)?)/gi,
          (m) => `<a href="${/^https?:/i.test(m) ? m : 'https://' + m}" target="_blank" rel="noopener">${m}</a>`);
        document.getElementById('dynamicAlert').className = 'show ' + (['warning','success','danger'].includes(a.type) ? a.type : 'info');
      }
    }
    status.textContent = 'Menyiapkan aplikasi...';
    const snap = await getDocs(collection(db, "apps"));
    allApps = [];
    snap.forEach(d => allApps.push(d.data()));
    window.filterApps();
  }catch(e){
    console.error(e);
    $list.innerHTML = '<div class="empty"><b>Data gagal dimuat</b>Periksa koneksi internet, lalu muat ulang halaman.</div>';
  }
  await minWait;
  hideSplash();
}

fetchPublicData();
</script>
</body>
</html>
